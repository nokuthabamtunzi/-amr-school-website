# AMR Primary School with ECD

This project is a premium, mobile-first school website for AMR Primary School with ECD in Zimbabwe. It is built with Next.js 14, TypeScript, Tailwind CSS and Supabase.

## Install and run

```bash
npm install
cp .env.example .env.local
npm run dev
```

Open http://localhost:3000.

## Add your AMR photos
Place your photos in:

- `/public/images/amr/`

Recommended placeholders:
- `amr-hero-1.svg`
- `amr-hero-2.svg`
- `amr-hero-3.svg`
- `campus-1.svg`
- `class-1.svg`
- `ecd-1.svg`
- `students-1.svg`

## Add your logos
Place your school or branding images in:

- `/public/images/logos/`

Files to swap later:
- `logo-1.svg`
- `logo-2.svg`
- `my-branding-logo.svg`

## Update school settings
Edit `/config/site.ts` to update:
- `SITE_NAME`
- `MOTTO`
- `SCHOOL_EMAIL`
- `SCHOOL_PHONE`
- `WHATSAPP_NUMBER`
- `ADDRESS`
- `GOOGLE_MAP_EMBED_URL`
- `FACEBOOK_URL`
- `GOOGLE_ACCOUNT_EMAIL`
- `SCHOOL_LOGO_PATHS`

## Supabase setup
1. Create a Supabase project.
2. Run `/supabase.sql` in the SQL editor.
3. Create Storage buckets:
   - `amr-gallery`
   - `amr-logos`
4. Add `.env.local` values from `.env.example`.

## Admin dashboard
Visit `/admin` and sign in with a Supabase Auth email/password account. The admin dashboard supports:
- gallery photo uploads
- logo replacement
- stats overview

## Deploy to Vercel
1. Push to GitHub.
2. Import into Vercel.
3. Add environment variables.
4. Deploy.
